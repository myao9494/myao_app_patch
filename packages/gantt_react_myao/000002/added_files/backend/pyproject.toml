[project]
name = "gantt-backend"
version = "0.1.0"
description = "Gantt chart backend API (FastAPI + SQLite)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-multipart>=0.0.21",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.40.0",
]

[tool.pytest.ini_options]
# backend 直下のスクリプトをテストとして拾わないよう tests/ だけを対象にする。
# テスト用DBの隔離は tests/conftest.py が行う。
testpaths = ["tests"]
pythonpath = ["."]
